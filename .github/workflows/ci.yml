name: CI

on:
  push:
    branches: [main, refactor_go]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne system dependencies
        run: sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" && echo "$unformatted" && exit 1
          fi

      - name: tests (with race detector)
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne system dependencies
        run: sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build ./cmd/emissioncalculator/...
        if: matrix.goos == 'linux'

      - name: Build (cross-compile check)
        run: go build -v ./cmd/emissioncalculator/...
        if: matrix.goos == 'linux'
